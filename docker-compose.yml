
services:
  # ===== POSTGRES DATABASE =====
  db:
    image: postgres:17
    container_name: law_set_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===== ADMINER (DB UI) =====
  adminer:
    image: adminer
    container_name: law_set_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db
    volumes:
      - ./adminer.css:/var/www/html/adminer.css
      

  # ===== RABBITMQ =====
  rabbitmq:
    image: rabbitmq:3-management
    container_name: law_set_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

